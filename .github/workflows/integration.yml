# Runs Alloy integration tests daily to ensure compatibility with the latest version of Alloy.

name: Integration

on:
  schedule:
    # Run daily
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Needed so we can run it manually

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@117919c943b804057be733b0c4034c5542e58959 # 2026-09-23T05-09-41Z-117919c9
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Run examples
        run: |
          # Run examples with the current version of Alloy
          ./scripts/test.sh

          # Fetch the latest commit hash of the `main` branch from the Alloy repository
          latest_alloy_commit=$(git ls-remote https://github.com/alloy-rs/alloy.git \
            | grep refs/heads/main \
            | cut -f 1)

          # Use the commit hash to update the rev in Cargo.toml
          sed -i '/alloy = { version = "[^"]*", features = \[/,/\] }/s/alloy = { version = "[^"]*",/alloy = { git = "https:\/\/github.com\/alloy-rs\/alloy", rev = "'"$latest_alloy_commit"'",/' \
          Cargo.toml

          # Update to the latest commit
          cargo update

          # Run the examples with the latest version of Alloy
          ./scripts/test.sh
